<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamic Island</title>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<style>
  :root {
    --accent: #0a84ff;
    --accent2: #64d2ff;
    --accent3: #bf5af2;
    --accent4: #30d158;
    --bg: rgba(0, 0, 0, .84);
    --bg2: rgba(30, 30, 34, .92);
    --text: #ffffff;
    --muted: #a1a1aa;
    --border: rgba(255, 255, 255, .15);
    --chip: rgba(255, 255, 255, .075);
    --font: "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", sans-serif;
    --glow: .65;
    --top-gap: 10px;
    --bottom-gap: 0px;
    --side-gap: 0px;
    --compact-w: 236px;
    --compact-h: 42px;
    --compact-radius: 21px;
    --expanded-w: 460px;
    --expanded-h: 406px;
    --expanded-radius: 30px;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { width: 100%; height: 100%; }

  body {
    margin: 0;
    overflow: hidden;
    background: transparent;
    color: var(--text);
    font-family: var(--font);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: var(--top-gap);
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  body.pos-left { justify-content: flex-start; padding-left: var(--side-gap); }
  body.pos-right { justify-content: flex-end; padding-right: var(--side-gap); }
  body.pos-bottom { align-items: flex-end; padding-top: 0; padding-bottom: var(--bottom-gap); }
  body.style-notch.pos-top { padding-top: 0; }
  body.style-notch.pos-bottom { padding-bottom: 0; }

  #island {
    position: relative;
    width: var(--compact-w);
    height: var(--compact-h);
    border-radius: var(--compact-radius);
    background:
      radial-gradient(120% 140% at 16% 0%, color-mix(in srgb, var(--accent) 17%, transparent), transparent 58%),
      radial-gradient(115% 140% at 105% 115%, color-mix(in srgb, var(--accent2) 13%, transparent), transparent 64%),
      linear-gradient(155deg, var(--bg2), var(--bg) 72%);
    border: 1px solid var(--border);
    box-shadow:
      0 0 0 1px color-mix(in srgb, var(--accent) calc(var(--glow) * 10%), transparent),
      0 14px 46px rgba(0, 0, 0, calc(.34 + var(--glow) * .26)),
      inset 0 1px 0 rgba(255, 255, 255, .075);
    overflow: hidden;
    transition:
      width .42s cubic-bezier(.22, 1, .36, 1),
      height .42s cubic-bezier(.22, 1, .36, 1),
      border-radius .42s cubic-bezier(.22, 1, .36, 1);
    will-change: width, height;
    isolation: isolate;
  }

  #island::after {
    content: "";
    position: absolute;
    left: 13%;
    right: 13%;
    top: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 78%, transparent), transparent);
    opacity: .9;
    pointer-events: none;
  }

  body.theme-iphone #island::before {
    content: "";
    position: absolute;
    left: 3%;
    right: 3%;
    top: 1px;
    height: 42%;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255, 255, 255, .095), transparent 82%);
    opacity: .9;
    pointer-events: none;
    z-index: -1;
  }

  body.style-notch.pos-top #island {
    border-top-left-radius: 0;
    border-top-right-radius: 0;
    border-top-color: transparent;
  }
  body.style-notch.pos-bottom #island {
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    border-bottom-color: transparent;
  }

  /* ---------- compact pill ---------- */

  .compact {
    position: absolute;
    inset: 0;
    height: var(--compact-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    gap: 6px;
    transition: opacity .14s ease;
  }

  #island.expanded .compact { opacity: 0; pointer-events: none; }

  .pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent),
                0 0 14px color-mix(in srgb, var(--accent) 72%, transparent);
    flex: 0 0 auto;
    animation: breathe 2.6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: .95; }
    50%      { transform: scale(.78); opacity: .65; }
  }

  .c-time {
    font-size: 14px;
    font-weight: 640;
    letter-spacing: .2px;
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }

  .c-track {
    flex: 1 1 0;
    min-width: 0;
    font-size: 10.5px;
    font-weight: 560;
    color: var(--text);
    opacity: .86;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  body.has-media .c-time { display: none; }

  .eq {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
    flex: 0 0 auto;
    opacity: .95;
  }

  .eq i {
    display: block;
    width: 2.5px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--accent2), var(--accent));
    animation: eq 1.1s ease-in-out infinite;
  }

  .eq i:nth-child(1) { height: 6px;  animation-delay: -.15s; }
  .eq i:nth-child(2) { height: 12px; animation-delay: -.45s; }
  .eq i:nth-child(3) { height: 8px;  animation-delay: -.75s; }
  .eq i:nth-child(4) { height: 11px; animation-delay: -.30s; }
  body.music-paused .eq i { animation-play-state: paused; opacity: .5; }

  @keyframes eq {
    0%, 100% { transform: scaleY(.45); }
    50%      { transform: scaleY(1); }
  }

  .c-batt {
    font-size: 10.5px;
    font-weight: 620;
    color: var(--muted);
    letter-spacing: .25px;
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }

  .privacy-mini {
    display: flex;
    align-items: center;
    gap: 3px;
    color: var(--accent3);
    flex: 0 0 auto;
  }
  .privacy-mini .ic { width: 12px; height: 12px; stroke-width: 2.2; }

  .mini-bell {
    position: relative;
    display: inline-grid;
    place-items: center;
    width: 17px;
    height: 17px;
    color: var(--accent);
    flex: 0 0 auto;
  }
  .mini-bell::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent2);
    box-shadow: 0 0 7px var(--accent2);
  }
  .mini-bell .ic { width: 13px; height: 13px; stroke-width: 2.1; }

  /* ---------- expanded panel ---------- */

  .panel {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 15px 18px 13px;
    opacity: 0;
    transform: translateY(6px) scale(.985);
    transform-origin: 50% 0;
    transition: opacity .18s ease, transform .3s cubic-bezier(.22, 1, .36, 1);
    pointer-events: none;
  }
  body.pos-bottom .panel { transform: translateY(-6px) scale(.985); transform-origin: 50% 100%; }

  #island.expanded {
    width: var(--expanded-w);
    height: var(--expanded-h);
    border-radius: var(--expanded-radius);
  }

  body.style-notch.pos-top #island.expanded {
    border-top-left-radius: 0;
    border-top-right-radius: 0;
    border-top-color: transparent;
  }
  body.style-notch.pos-bottom #island.expanded {
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    border-bottom-color: transparent;
  }

  #island.expanded .panel {
    opacity: 1;
    transform: none;
    transition-delay: .1s, .1s;
    pointer-events: auto;
  }

  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 26px;
  }

  .head-left { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .head-actions { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; }

  .brand-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 85%, transparent);
  }

  .google-logo { display: none; width: 18px; height: 18px; flex: 0 0 auto; }
  body.theme-google .google-logo { display: block; }
  body.theme-google .brand-dot { display: none; }
  body.theme-google { --font: "Google Sans", "Product Sans", "Segoe UI", sans-serif; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    padding: 0 10px;
    border-radius: 9px;
    background: var(--chip);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 560;
    letter-spacing: .15px;
    white-space: nowrap;
  }

  .date { color: var(--text); opacity: .82; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .batt-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 80%, transparent);
  }

  .batt-dot.charging { animation: breathe 1.3s ease-in-out infinite; }
  .batt-dot.low { background: #f87171; box-shadow: 0 0 8px rgba(248, 113, 113, .8); }

  .icon-btn {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--chip);
    color: var(--muted);
    cursor: pointer;
    padding: 0;
    transition: background .16s, color .16s, transform .16s;
  }

  .icon-btn:hover {
    color: var(--text);
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    transform: translateY(-1px);
  }

  .sysline {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    min-height: 22px;
    align-items: center;
  }

  .sys-seg { display: flex; align-items: center; gap: 6px; min-width: 0; }

  .sys-name {
    color: var(--muted);
    font-size: 8.5px;
    font-weight: 720;
    letter-spacing: .85px;
    flex: 0 0 auto;
  }

  .sys-track {
    flex: 1 1 auto;
    height: 4px;
    border-radius: 99px;
    background: var(--chip);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .sys-track > span {
    display: block;
    width: 0;
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 0 9px color-mix(in srgb, var(--accent) 45%, transparent);
    transition: width .45s ease, background .25s ease;
  }

  .sys-track > span.hot { background: linear-gradient(90deg, #fb923c, #f87171); box-shadow: 0 0 9px rgba(248, 113, 113, .45); }

  .sys-val {
    flex: 0 0 auto;
    min-width: 26px;
    text-align: right;
    color: var(--text);
    font-size: 9.5px;
    font-weight: 620;
    font-variant-numeric: tabular-nums;
    opacity: .9;
  }

  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    min-height: 92px;
  }
  body.has-media .hero { display: none; }

  .clock {
    font-size: 48px;
    line-height: .95;
    font-weight: 650;
    letter-spacing: -1.6px;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(120deg, var(--text) 30%, var(--accent) 130%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .greeting { color: var(--muted); font-size: 12px; letter-spacing: .2px; }

  .battery { margin-top: 7px; display: flex; align-items: center; gap: 9px; }

  .bar {
    flex: 1;
    height: 4px;
    border-radius: 99px;
    background: var(--chip);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .bar > span {
    display: block;
    height: 100%;
    width: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 55%, transparent);
    transition: width .5s ease, background .3s;
  }
  .bar > span.low { background: linear-gradient(90deg, #f87171, #fb923c); }
  .chip.small { height: 22px; padding: 0 9px; }

  /* ---------- music ---------- */

  .music-card {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 11px;
    border-radius: 16px;
    border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--border));
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 12%, var(--chip)), var(--chip));
    min-height: 102px;
  }

  .music-cover {
    width: 52px;
    height: 52px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    color: var(--text);
    background:
      radial-gradient(120% 120% at 20% 10%, color-mix(in srgb, var(--accent2) 52%, transparent), transparent 60%),
      linear-gradient(145deg, color-mix(in srgb, var(--accent) 65%, #101014), #101014);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 7px 18px rgba(0,0,0,.28);
  }
  .music-cover .ic { width: 25px; height: 25px; }

  .music-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .music-kicker { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 9.5px; letter-spacing: .3px; text-transform: uppercase; }
  .live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent4); box-shadow: 0 0 7px var(--accent4); }
  .music-app { margin-left: auto; text-transform: none; letter-spacing: 0; opacity: .72; max-width: 78px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .music-title { font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music-artist { color: var(--muted); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music-progress { height: 3px; margin-top: 4px; border-radius: 99px; background: var(--chip); overflow: hidden; }
  .music-progress > span { display: block; height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .35s linear; }
  .music-times { display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; font-variant-numeric: tabular-nums; margin-top: 1px; }

  .music-controls { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
  .mini-control {
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .mini-control:hover { color: var(--text); background: var(--chip); }
  .mini-control.play { width: 30px; height: 30px; color: var(--text); background: color-mix(in srgb, var(--accent) 25%, transparent); }
  .mini-control.play:hover { background: color-mix(in srgb, var(--accent) 38%, transparent); }
  .mini-control .ic { width: 15px; height: 15px; }
  .mini-control.play .ic { width: 16px; height: 16px; }

  /* ---------- privacy / notification cards ---------- */

  .status-card {
    width: 100%;
    min-height: 34px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--chip);
    color: var(--text);
    font-family: inherit;
    font-size: 10.5px;
    text-align: left;
    cursor: pointer;
    transition: background .16s, border-color .16s;
  }
  .status-card:hover { background: color-mix(in srgb, var(--accent) 14%, var(--chip)); border-color: color-mix(in srgb, var(--accent) 42%, transparent); }
  .status-icon { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 8px; flex: 0 0 auto; }
  .status-icon .ic { width: 14px; height: 14px; }
  .privacy-card .status-icon { color: var(--accent3); background: color-mix(in srgb, var(--accent3) 18%, transparent); }
  .notice-card .status-icon { color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .status-copy { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .status-title { font-size: 10.5px; font-weight: 620; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status-sub { color: var(--muted); font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status-arrow { color: var(--muted); flex: 0 0 auto; }
  .status-arrow .ic { width: 13px; height: 13px; }

  /* ---------- quick actions ---------- */

  .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: auto; }

  .quick-btn {
    position: relative;
    height: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--chip);
    color: var(--muted);
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 560;
    letter-spacing: .15px;
    cursor: pointer;
    transition: background .16s, color .16s, border-color .16s, transform .16s;
  }

  .quick-btn .ic { width: 17px; height: 17px; }
  .quick-btn:hover {
    color: var(--text);
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    transform: translateY(-1px);
  }
  .quick-btn:active { transform: translateY(0) scale(.985); }
  .quick-btn.on { color: var(--text); border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 20%, transparent); }

  body.theme-google .quick-btn:nth-child(1) { color: #8ab4f8; }
  body.theme-google .quick-btn:nth-child(2) { color: #f28b82; }
  body.theme-google .quick-btn:nth-child(3) { color: #fdd663; }
  body.theme-google .quick-btn:nth-child(4) { color: #81c995; }

  .qdot {
    position: absolute;
    top: 7px;
    right: 9px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    transition: opacity .2s;
  }
  .quick-btn.on .qdot { opacity: 1; }

  .foot {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 9.5px;
    letter-spacing: .25px;
    height: 14px;
    opacity: .62;
    margin-top: 1px;
  }

  .toast {
    position: absolute;
    left: 50%;
    bottom: 40px;
    transform: translate(-50%, 8px);
    max-width: 84%;
    padding: 7px 13px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--accent) 24%, var(--bg2));
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    color: var(--text);
    font-size: 11px;
    font-weight: 560;
    letter-spacing: .15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .25s ease;
    z-index: 5;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .ic {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: 0 0 auto;
  }
</style>
</head>

    </symbol>
    <symbol id="i-power" viewBox="0 0 24 24">
      <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>
    </symbol>
    <symbol id="i-eye" viewBox="0 0 24 24">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><polyline points="6 15 12 9 18 15"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><polyline points="13 6 19 12 13 18"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>
    </symbol>
    <symbol id="i-mic" viewBox="0 0 24 24">
      <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/>
    </symbol>
    <symbol id="i-camera" viewBox="0 0 24 24">
      <path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>
    </symbol>
    <symbol id="i-music" viewBox="0 0 24 24">
      <path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>
    </symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><polygon points="18 5 18 19 8 12 18 5"/><line x1="6" y1="5" x2="6" y2="19"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><polygon points="6 5 6 19 16 12 6 5"/><line x1="18" y1="5" x2="18" y2="19"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><polygon points="8 5 19 12 8 19 8 5"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><line x1="9" y1="5" x2="9" y2="19"/><line x1="15" y1="5" x2="15" y2="19"/></symbol>
  </svg>

  <div id="island" class="collapsed">
    <div class="compact">
      <span class="pulse"></span>
      <span class="c-time" id="compactTime">--:--</span>
      <span class="c-track" id="compactTrack" hidden>—</span>
      <div class="eq" id="compactEq" hidden aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <span class="privacy-mini" id="compactPrivacy" hidden></span>
      <span class="mini-bell" id="compactBell" data-action="notifications" title="Открыть центр уведомлений" hidden>
        <svg class="ic"><use href="#i-bell"/></svg>
      </span>
      <span class="c-batt" id="compactBattery">—</span>
    </div>

    <section class="panel">
      <header class="head">
        <div class="head-left">
          <svg class="google-logo" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
          </svg>
          <span class="brand-dot"></span>
          <span class="date" id="dateLabel">Сегодня</span>
        </div>
        <div class="head-actions">
          <div class="chip batt-chip"><span class="batt-dot" id="battDot"></span><span id="batteryText">—</span></div>
          <button class="icon-btn" data-action="collapse" title="Свернуть"><svg class="ic"><use href="#i-chevron"/></svg></button>
          <button class="icon-btn" data-action="settings" title="Настройки"><svg class="ic"><use href="#i-gear"/></svg></button>
        </div>
      </header>

      <div class="sysline">
        <div class="sys-seg">
          <span class="sys-name">CPU</span>
          <span class="sys-track"><span id="cpuFill"></span></span>
          <span class="sys-val" id="cpuValue">—</span>
        </div>
        <div class="sys-seg">
          <span class="sys-name">RAM</span>
          <span class="sys-track"><span id="ramFill"></span></span>
          <span class="sys-val" id="ramValue">—</span>
        </div>
      </div>

      <div class="hero">
        <div class="clock" id="clock">--:--</div>
        <div class="greeting" id="greeting">Добро пожаловать</div>
        <div class="battery">
          <div class="bar"><span id="batteryFill"></span></div>
          <span class="chip small" id="batteryHint">Батарея</span>
        </div>
      </div>

      <section class="music-card" id="musicCard" hidden>
        <div class="music-cover"><svg class="ic"><use href="#i-music"/></svg></div>
        <div class="music-main">
          <div class="music-kicker"><span class="live-dot"></span><span id="musicKicker">Сейчас играет</span><span class="music-app" id="musicApp"></span></div>
          <div class="music-title" id="musicTitle">—</div>
          <div class="music-artist" id="musicArtist">—</div>
          <div class="music-progress"><span id="musicFill"></span></div>
          <div class="music-times"><span id="musicPos">0:00</span><span id="musicDur">0:00</span></div>
        </div>
        <div class="music-controls">
          <button class="mini-control" data-action="media_prev" title="Предыдущий трек"><svg class="ic"><use href="#i-prev"/></svg></button>
          <button class="mini-control play" id="playBtn" data-action="media_toggle" title="Пауза / воспроизведение"><svg class="ic"><use id="playIcon" href="#i-pause"/></svg></button>
          <button class="mini-control" data-action="media_next" title="Следующий трек"><svg class="ic"><use href="#i-next"/></svg></button>
        </div>
      </section>

      <button class="status-card privacy-card" id="privacyCard" data-action="privacy" hidden>
        <span class="status-icon" id="privacyIcon"><svg class="ic"><use href="#i-mic"/></svg></span>
        <span class="status-copy"><span class="status-title" id="privacyTitle">Микрофон используется</span><span class="status-sub" id="privacySub"></span></span>
        <span class="status-arrow"><svg class="ic"><use href="#i-arrow"/></svg></span>
      </button>

      <button class="status-card notice-card" id="noticeCard" data-action="notifications" hidden>
        <span class="status-icon"><svg class="ic"><use href="#i-bell"/></svg></span>
        <span class="status-copy"><span class="status-title" id="noticeApp">Уведомление</span><span class="status-sub" id="noticeText"></span></span>
        <span class="status-arrow"><svg class="ic"><use href="#i-arrow"/></svg></span>
      </button>

      <div class="quick">
        <button class="quick-btn" data-action="settings"><svg class="ic"><use href="#i-gear"/></svg><span>Настройки</span></button>
        <button class="quick-btn" data-action="theme"><svg class="ic"><use href="#i-palette"/></svg><span>Тема</span></button>
        <button class="quick-btn" id="autostartBtn" data-action="autostart"><span class="qdot"></span><svg class="ic"><use href="#i-power"/></svg><span>Автозапуск</span></button>
        <button class="quick-btn" data-action="hide"><svg class="ic"><use href="#i-eye"/></svg><span>Скрыть</span></button>
      </div>

      <footer class="foot">
        <span>Правая кнопка мыши — меню</span>
      </footer>
    </section>

    <div class="toast" id="toast"></div>
  </div>

<script>
  (function () {
    "use strict";

    var island = document.getElementById("island");
    var bridge = null;
    var autostartOn = false;
    var toastTimer = null;
    var prefs = { showMusic: true, showPrivacy: true, showNotifications: true };
    var lastNative = { media: null, privacy: null, notification: null };

    function $(id) { return document.getElementById(id); }

    window.islandAction = function (name) {
      if (bridge && typeof bridge.action === "function") {
        bridge.action(String(name));
      }
    };

    document.querySelectorAll("[data-action]").forEach(function (el) {
      el.addEventListener("click", function (event) {
        event.stopPropagation();
        window.islandAction(el.getAttribute("data-action"));
      });
    });

    document.addEventListener("contextmenu", function (event) { event.preventDefault(); });
    document.addEventListener("dragstart", function (e) { e.preventDefault(); });

    var compactEl = document.querySelector(".compact");
    if (compactEl) {
      compactEl.addEventListener("click", function (event) {
        if (island.classList.contains("collapsed")) {
          event.stopPropagation();
          window.islandAction("toggle");
        }
      });
    }

    if (window.qt && qt.webChannelTransport) {
      new QWebChannel(qt.webChannelTransport, function (channel) {
        bridge = channel.objects.bridge;
      });
    }

    window.islandExpand = function (flag) {
      island.classList.toggle("expanded", !!flag);
      island.classList.toggle("collapsed", !flag);
    };

    function setBattery(percent, charging) {
      var pct = (percent === null || percent === undefined) ? null : Math.max(0, Math.min(100, Math.round(percent)));
      var text = pct === null ? "—" : pct + "%";
      $("compactBattery").textContent = text;
      $("batteryText").textContent = text;
      var fill = $("batteryFill");
      var dot = $("battDot");
      var low = pct !== null && pct <= 20 && !charging;
      if (pct !== null) {
        fill.style.width = pct + "%";
        fill.classList.toggle("low", low);
      }
      dot.classList.toggle("low", low);
      dot.classList.toggle("charging", !!charging);
      $("batteryHint").textContent = charging ? "Зарядка" : "Батарея";
    }

    function refreshAutostart() {
      $("autostartBtn").classList.toggle("on", autostartOn);
      $("autostartBtn").title = autostartOn ? "Автозапуск включён" : "Автозапуск выключен";
    }

    function formatTime(seconds) {
      var value = Math.max(0, Number(seconds) || 0);
      var minutes = Math.floor(value / 60);
      var secs = Math.floor(value % 60);
      return minutes + ":" + (secs < 10 ? "0" : "") + secs;
    }

    function renderMedia(media) {
      var active = !!(media && media.active && (media.title || media.artist));
      var shown = active && prefs.showMusic;
      document.body.classList.toggle("has-media", shown);
      document.body.classList.toggle("music-paused", !!(media && !media.playing));
      $("musicCard").hidden = !shown;
      $("compactTrack").hidden = !shown;
      $("compactEq").hidden = !shown;
      if (!shown) { $("compactTrack").textContent = "—"; return; }
      var title = media.title || "Без названия";
      $("compactTrack").textContent = title;
      $("compactTrack").title = title + (media.artist ? " — " + media.artist : "");
      $("musicTitle").textContent = title;
      $("musicArtist").textContent = media.artist || "Неизвестный исполнитель";
      $("musicApp").textContent = media.app || "";
      $("musicKicker").textContent = media.playing ? "Сейчас играет" : "Пауза";
      $("playIcon").setAttribute("href", media.playing ? "#i-pause" : "#i-play");
      var pos = Number(media.position) || 0;
      var dur = Number(media.duration) || 0;
      $("musicPos").textContent = formatTime(pos);
      $("musicDur").textContent = formatTime(dur);
      $("musicFill").style.width = dur > 0 ? Math.max(0, Math.min(100, pos / dur * 100)) + "%" : "0%";
    }

    function setPrivacyIcon(kind) {
      var use = document.createElementNS("http://www.w3.org/2000/svg", "use");
      use.setAttribute("href", kind === "mic" ? "#i-mic" : "#i-camera");
      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "ic");
      svg.appendChild(use);
      return svg;
    }

    function renderPrivacy(privacy) {
      var mic = (privacy && privacy.mic) || [];
      var camera = (privacy && privacy.camera) || [];
      var active = (mic.length > 0 || camera.length > 0) && prefs.showPrivacy;
      var compact = $("compactPrivacy");
      compact.innerHTML = "";
      compact.hidden = !active;
      $("privacyCard").hidden = !active;
      if (!active) { return; }
      if (mic.length) {
        var micIcon = setPrivacyIcon("mic");
        micIcon.setAttribute("title", "Микрофон: " + mic.join(", "));
        compact.appendChild(micIcon);
      }
      if (camera.length) {
        var camIcon = setPrivacyIcon("camera");
        camIcon.setAttribute("title", "Камера: " + camera.join(", "));
        compact.appendChild(camIcon);
      }
      var icon = $("privacyIcon");
      icon.innerHTML = "";
      icon.appendChild(setPrivacyIcon(mic.length ? "mic" : "camera"));
      var parts = [];
      if (mic.length) { parts.push("Микрофон: " + mic.join(", ")); }
      if (camera.length) { parts.push("Камера: " + camera.join(", ")); }
      $("privacyTitle").textContent = parts.join(" · ");
      $("privacySub").textContent = "Нажмите, чтобы открыть параметры конфиденциальности";
    }

    function renderNotification(notice) {
      var active = !!(notice && notice.app) && prefs.showNotifications;
      $("compactBell").hidden = !active;
      $("noticeCard").hidden = !active;
      if (!active) { return; }
      $("noticeApp").textContent = notice.app;
      $("noticeText").textContent = notice.text || "Новое уведомление";
      $("noticeCard").title = notice.text || "Открыть центр уведомлений";
    }

    window.islandStats = function (data) {
      data = data || {};
      var cpu = Math.max(0, Math.min(100, Math.round(Number(data.cpu) || 0)));
      var ram = Math.max(0, Math.min(100, Math.round(Number(data.ram) || 0)));
      var cpuFill = $("cpuFill");
      var ramFill = $("ramFill");
      cpuFill.style.width = cpu + "%";
      ramFill.style.width = ram + "%";
      cpuFill.classList.toggle("hot", cpu >= 80);
      ramFill.classList.toggle("hot", ram >= 80);
      $("cpuValue").textContent = cpu + "%";
      $("ramValue").textContent = ram + "%";
      $("cpuValue").title = "Загрузка процессора: " + cpu + "%";
      var memory = "";
      if (Number(data.ram_used) > 0 && Number(data.ram_total) > 0) {
        memory = " · " + data.ram_used + " / " + data.ram_total + " ГБ";
      }
      $("ramValue").title = "Оперативная память: " + ram + "%" + memory;
    };

    window.islandTick = function (data) {
      data = data || {};
      if (data.time) {
        $("clock").textContent = data.time;
        $("compactTime").textContent = data.time;
      }
      if (data.date) { $("dateLabel").textContent = data.date; }
      if (data.greeting) { $("greeting").textContent = data.greeting; }
      if (Object.prototype.hasOwnProperty.call(data, "battery")) {
        setBattery(data.battery, !!data.charging);
      }
      if (Object.prototype.hasOwnProperty.call(data, "autostart")) {
        autostartOn = !!data.autostart;
        refreshAutostart();
      }
    };

    window.islandSetConfig = function (cfg) {
      cfg = cfg || {};
      var root = document.documentElement.style;
      var vars = cfg.vars || {};
      Object.keys(vars).forEach(function (key) { root.setProperty("--" + key, vars[key]); });
      root.setProperty("--glow", String(cfg.glow === undefined ? 0.65 : cfg.glow));

      var style = cfg.style === "notch" ? "notch" : "island";
      var pos = String(cfg.position || "top-center");
      var vertical = pos.indexOf("bottom") === 0 ? "bottom" : "top";
      var align = pos.indexOf("left") >= 0 ? "left" : (pos.indexOf("right") >= 0 ? "right" : "center");
      document.body.classList.remove(
        "pos-top", "pos-bottom", "pos-left", "pos-center", "pos-right",
        "style-island", "style-notch"
      );
      Array.from(document.body.classList).forEach(function (name) {
        if (name.indexOf("theme-") === 0) { document.body.classList.remove(name); }
      });
      document.body.classList.add("pos-" + vertical, "pos-" + align, "style-" + style);
      document.body.classList.add("theme-" + (cfg.theme || "iphone"));

      var notch = style === "notch";
      root.setProperty("--compact-w", (notch ? 286 : 236) + "px");
      root.setProperty("--compact-h", (notch ? 34 : 42) + "px");
      root.setProperty("--compact-radius", (notch ? 18 : 21) + "px");
      root.setProperty("--expanded-w", "460px");
      root.setProperty("--expanded-h", "406px");
      root.setProperty("--expanded-radius", (notch ? 28 : 30) + "px");
      var sideGap = (align === "left" || align === "right") ? Number(cfg.offsetX || 0) : 0;
      var verticalGap = notch ? 0 : Number(cfg.offsetY || 0);
      root.setProperty("--side-gap", sideGap + "px");
      root.setProperty("--top-gap", vertical === "top" ? verticalGap + "px" : "0px");
      root.setProperty("--bottom-gap", vertical === "bottom" ? verticalGap + "px" : "0px");

      document.body.classList.toggle("hide-battery", cfg.showBattery === false);
      prefs.showMusic = cfg.showMusic !== false;
      prefs.showPrivacy = cfg.showPrivacy !== false;
      prefs.showNotifications = cfg.showNotifications !== false;
      if (Object.prototype.hasOwnProperty.call(cfg, "autostart")) {
        autostartOn = !!cfg.autostart;
        refreshAutostart();
      }
      renderMedia(lastNative.media);
      renderPrivacy(lastNative.privacy);
      renderNotification(lastNative.notification);
    };

    window.islandNative = function (data) {
      data = data || {};
      if (Object.prototype.hasOwnProperty.call(data, "media")) { lastNative.media = data.media; }
      if (Object.prototype.hasOwnProperty.call(data, "privacy")) { lastNative.privacy = data.privacy; }
      if (Object.prototype.hasOwnProperty.call(data, "notification")) { lastNative.notification = data.notification; }
      renderMedia(lastNative.media);
      renderPrivacy(lastNative.privacy);
      renderNotification(lastNative.notification);
    };

    window.islandToast = function (text) {
      var toast = $("toast");
      toast.textContent = String(text || "");
      toast.classList.add("show");
      if (toastTimer) { clearTimeout(toastTimer); }
      toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1900);
    };

    setBattery(null, false);
    refreshAutostart();
  })();
</script>
</body>
</html>
